name: Publish Confluence

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: confluence-publication-main
  # A run that has started -- including one parked at the environment gate --
  # is never cancelled: a cancelled write is an uncertain attempt that needs
  # an owner reconciliation. Runs still queued behind it are a different
  # matter. With the previous queue setting every push to main waited its
  # turn and demanded its own approval, so eight merges in an afternoon meant
  # eight approvals and four harmless failures. Without it GitHub keeps only
  # the newest pending run and cancels older ones before they execute a step,
  # which the recovery gate now recognises as safe. The newest run publishes
  # from current main, which contains everything the cancelled ones would have.
  cancel-in-progress: false

jobs:
  publish:
    name: Approved merged documentation publication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: confluence-publication
    steps:
      - name: Check out merged main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned converter
        run: 'python3 -m pip install --require-hashes --only-binary=:all: -r config/publication-requirements.txt'

      - name: Validate publication contract and fixtures
        run: python3 scripts/check-publication.py

      - name: Recover successful publication checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_confluence.py prepare '${{ github.event.before }}' '${{ github.sha }}' --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}'

      - name: Publish approved selected documents
        env:
          CONFLUENCE_BASE_URL: ${{ vars.CONFLUENCE_BASE_URL }}
          CONFLUENCE_EMAIL: ${{ vars.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: python3 scripts/publish_confluence.py publish '${{ github.event.before }}' '${{ github.sha }}'
