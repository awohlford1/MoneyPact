name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Documentation, lint, type-check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      SCARF_ANALYTICS: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan introduced commits and reachable history
        run: python3 scripts/secret_scanner.py ci '${{ github.event_name }}' '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}' '${{ github.sha }}'

      # Runs before the Node setup so a documentation-only change fails fast
      # without installing dependencies. Uses the standard library only, so it
      # needs no pip install on the runner.
      - name: Check document vocabulary consistency
        run: python3 scripts/check-doc-vocabulary.py

      # --offline is the half that needs no Jira credentials: it compares every
      # pinned source version against the document it names, which is how the
      # CBD-71 baseline sat on CBD-68 v1.0 for twenty days after v1.1 landed.
      # The status half reads live Jira and stays a manual pre-closure step.
      - name: Check pinned source versions
        run: python3 scripts/check-jira-freshness.py --offline

      # Same shape: the half that needs credentials stays a manual step, and
      # --offline says plainly that it checked nothing rather than passing
      # silently. It computes CBD-368-AC06's completeness claim, which three
      # hand sweeps got wrong -- CBD-13 conventions section 11.
      - name: Check AN-92 criteria
        run: python3 scripts/check-an92-criteria.py --offline

      - name: Check CBD-73 documentation package
        run: python3 scripts/audit-cbd-73.py

      - name: Check CBD-74 documentation package
        run: python3 scripts/audit-cbd-74.py

      - name: Check CBD-75 documentation package
        run: python3 scripts/audit-cbd-75.py

      - name: Check CBD-76 documentation package
        run: python3 scripts/audit-cbd-76.py

      - name: Check CBD-82 documentation package
        run: python3 scripts/audit-cbd-82.py

      # CBD-95 verifies eleven frozen source blobs. It was written before this
      # workflow existed and was never added, so three CBD-72 pins went stale on
      # August 18, 2026 and nothing noticed for a fortnight. Its working-tree
      # scope check is vacuous on a fresh checkout; the blob checks are the value.
      - name: Check CBD-95 documentation package
        run: python3 scripts/audit-cbd-95.py

      - name: Check CBD-103 documentation package
        run: python3 scripts/audit-cbd-103.py

      - name: Check CBD-104 documentation package
        run: python3 scripts/audit-cbd-104.py

      - name: Check CBD-105 documentation package
        run: python3 scripts/audit-cbd-105.py

      - name: Check CBD-106 documentation package
        run: python3 scripts/audit-cbd-106.py

      - name: Check CBD-107 documentation package
        run: python3 scripts/audit-cbd-107.py

      - name: Check CBD-130 documentation package
        run: python3 scripts/audit-cbd-130.py

      - name: Check CBD-108 documentation package
        run: python3 scripts/audit-cbd-108.py

      # The three CBD-13 metric packages. Wired in one change after all three
      # merged, per the approved measurement conventions section 12: each
      # package writes its own audit and none touches this file, so three
      # concurrent packages cannot conflict here.
      - name: Check CBD-77 documentation package
        run: python3 scripts/audit-cbd-77.py

      - name: Check CBD-78 documentation package
        run: python3 scripts/audit-cbd-78.py

      - name: Check CBD-79 documentation package
        run: python3 scripts/audit-cbd-79.py

      # Cross-package: this one reads CBD-77, CBD-78 and CBD-79 as well as its
      # own register, so it fails if a metric loses its source or a proposal is
      # dropped. It is the check that keeps the three packages agreeing.
      - name: Check CBD-80 documentation package
        run: python3 scripts/audit-cbd-80.py

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Run all workspace checks
        run: npm run check
